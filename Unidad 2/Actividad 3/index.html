<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda - Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Mi Tienda</h1>
    </header>

    <main>
        <section class="featured">
            <h2>Producto destacado</h2>
            <div class="featured-card">
                <img class="featured-img" src="https://placehold.co/220x220" alt="Dualsense PS5">
                <div class="featured-info">
                    <h3>Dualsense PS5</h3>
                    <p>Control inalámbrico Sony para PlayStation 5</p>
                    <span class="price">$149.900</span>
                    <button>Comprar</button>
                </div>
            </div>
        </section>

        <section class="catalog">
            <h2>Catálogo</h2>
            <div class="grid">

                <div class="product-card"> 
                    <img src="https://placehold.co/200x200" alt="Teclado mecánico"> 
                    <h3>Teclado mecánico</h3> 
                    <span class="price">$35.000</span> 
                </div>

                <div class="product-card"> 
                    <img src="https://placehold.co/200x200" alt="Mouse inalámbrico"> 
                    <h3>Mouse inalámbrico</h3> 
                    <span class="price">$30.000</span> 
                </div>

                <div class="product-card"> 
                    <img src="https://placehold.co/200x200" alt="Monitor 4K"> 
                    <h3>Monitor 4K</h3> 
                    <span class="price">$175.000</span> 
                </div>

                <div class="product-card"> 
                    <img src="https://placehold.co/200x200" alt="Auriculares inalámbricos"> 
                    <h3>Auriculares inalámbricos</h3> 
                    <span class="price">$45.000</span> 
                </div>

                <div class="product-card"> 
                    <img src="https://placehold.co/200x200" alt="MousePad"> 
                    <h3>MousePad</h3> 
                    <span class="price">$15.000</span> 
                </div>

                <div class="product-card"> 
                    <img src="https://placehold.co/200x200" alt="Webcam HD"> 
                    <h3>Webcam HD</h3> 
                    <span class="price">$25.000</span> 
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Mi Tienda</p>
    </footer>
</body>

</html>
