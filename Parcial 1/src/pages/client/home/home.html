<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Store - Catálogo</title>
  <link rel="stylesheet" href="./home.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="./home.html">Food Store</a>
    <nav>
      <a href="./home.html">Catálogo</a>
      <a href="../cart/cart.html">Carrito <span id="cart-count">0</span></a>
    </nav>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Categorías</h2>
      <div id="categories"></div>
    </aside>

    <section class="content">
      <div class="hero">
        <div>
          <p class="eyebrow">FOOD STORE</p>
          <h1>Catálogo de productos</h1>
          <p>Buscá un producto o elegí una categoría.</p>
        </div>
        <a class="cart-link" href="../cart/cart.html">Ver carrito</a>
      </div>

      <div class="search-box">
        <label for="search">Buscar por nombre</label>
        <input id="search" type="search" placeholder="Ej.: pizza, hamburguesa..." autocomplete="off">
      </div>

      <p id="result-message" class="result-message"></p>
      <div id="products" class="products"></div>
    </section>
  </main>

  <script type="module" src="./home.ts"></script>
</body>
</html>
